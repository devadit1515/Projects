<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Devadit — Projects</title>
  <meta name="description" content="Selected projects by Devadit.">
  <meta name="theme-color" content="#07060f">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500&family=JetBrains+Mono:wght@400;500&family=Unbounded:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/style.css">
</head>
<body>
  <canvas class="webgl" aria-hidden="true"></canvas>
  <div class="track" data-track></div>

  <section class="intro" data-intro>
    <p class="intro__kicker" data-intro-item>Selected work &nbsp;·&nbsp; 2024 — 2026</p>
    <h1 class="intro__title" data-split>Devadit</h1>
    <p class="intro__role" data-intro-item data-role></p>
    <button class="intro__enter" type="button" data-enter data-intro-item>
      <span>Enter the valley</span>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </button>
    <p class="intro__hint" data-intro-item>Scroll to travel<span class="intro__hint-extra"> &nbsp;·&nbsp; Click a monument to open it</span></p>
  </section>

  <header class="hud" data-hud>
    <a class="brand" href="#" data-home>
      <span class="brand__name">Devadit</span>
      <span class="brand__sub">Projects ©2026</span>
    </a>
    <nav class="hud__nav">
      <button type="button" class="pill" data-open-index>Index</button>
      <button type="button" class="pill" data-go-contact>Contact</button>
    </nav>
  </header>

  <aside class="card" data-card aria-live="polite"></aside>

  <nav class="rail" data-rail aria-label="Project progress">
    <span class="rail__fill" data-rail-fill></span>
  </nav>

  <div class="scroll-hint" data-scroll-hint>
    <span>Scroll</span>
    <span class="scroll-hint__line"></span>
  </div>

  <section class="outro" data-outro>
    <p class="outro__kicker">End of the road, for now</p>
    <h2 class="outro__title">Let's build something.</h2>
    <div class="outro__links" data-contact-links></div>
  </section>

  <div class="index" data-index data-lenis-prevent role="dialog" aria-modal="true" aria-label="Project index" hidden>
    <div class="index__head">
      <span class="index__label">Index</span>
      <button type="button" class="pill" data-close-index>Close</button>
    </div>
    <ol class="index__list" data-index-list></ol>
  </div>

  <div class="detail" data-detail role="dialog" aria-modal="true" aria-labelledby="detail-title" hidden>
    <div class="detail__backdrop" data-close-detail></div>
    <article class="detail__panel" data-detail-panel data-lenis-prevent></article>
  </div>

  <div class="cursor" data-cursor aria-hidden="true">
    <div class="cursor__follow" data-cursor-follow>
      <span class="cursor__ring"></span>
      <span class="cursor__label">Open</span>
    </div>
    <div class="cursor__follow" data-cursor-lead>
      <span class="cursor__dot"></span>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
